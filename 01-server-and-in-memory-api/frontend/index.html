<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Finance Tracker</h1>
      <p class="muted">Frontend :5500 → Express API :3000</p>

      <section class="summary">
        <div><span>Income</span><strong id="income">–</strong></div>
        <div><span>Expense</span><strong id="expense">–</strong></div>
        <div><span>Balance</span><strong id="balance">–</strong></div>
      </section>

      <form id="transaction-form">
        <select name="type" aria-label="Transaction type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <input name="amount" type="number" step="0.01" placeholder="Amount" required />
        <input name="category" placeholder="Category" required />
        <input name="note" placeholder="Note" required />
        <input name="date" type="date" />
        <button>Add transaction</button>
      </form>

      <p id="error" role="alert"></p>
      <ul id="transactions"></ul>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
